<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOOMA — By Vayu</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      text-align: center;
      /* Shifts the block slightly above dead-center */
      transform: translateY(-6vh);
    }

    h1 {
      font-size: clamp(3.5rem, 11vw, 8.5rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      /* Offsets the trailing letter-spacing so the word stays visually centered */
      padding-left: 0.22em;
      line-height: 1.05;
      color: #ffffff;
    }

    p {
      margin-top: 1rem;
      font-size: clamp(0.95rem, 2vw, 1.2rem);
      font-weight: 300;
      letter-spacing: 0.14em;
      padding-left: 0.14em;
      color: #ffffff;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>LOOMA</h1>
    <p>By Vayu</p>
  </main>
</body>
</html>
