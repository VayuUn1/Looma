<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOMA — By Vayu</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{height:100vh;background:#000;color:#fff;font-family:'Space Grotesk',sans-serif;display:grid;place-items:center;overflow:hidden;user-select:none;-webkit-user-select:none}
button,input{outline:none;-webkit-tap-highlight-color:transparent;user-select:none}
.menu{position:fixed;top:18px;left:18px;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);border-radius:14px}
.btn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);display:grid;place-items:center;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.btn:active{transform:scale(.82)}
.bounce{animation:b .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes b{0%{transform:scale(.8)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
.tri{width:0;height:0;margin-left:2px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid #fff}
.sq{display:none;gap:3px}.sq i{width:3.5px;height:11px;background:#fff;border-radius:1px}
.on .tri{display:none}.on .sq{display:flex}
.bars{display:flex;flex-direction:column;gap:6px;width:145px}
.row{display:flex;align-items:center;gap:6px;font-size:10px;color:rgba(255,255,255,.55);letter-spacing:.08em}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:rgba(255,255,255,.22);border-radius:9px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#fff}
.center{text-align:center;transform:translateY(-22vh);position:relative;z-index:2;pointer-events:none}
h1{font-size:clamp(2.2rem,6vw,4.5rem);letter-spacing:.22em;padding-left:.22em}
p{margin-top:.7rem;font-size:clamp(.85rem,1.5vw,1.05rem);font-weight:300;letter-spacing:.14em;padding-left:.14em;opacity:.85}
#ytWrap{position:fixed;bottom:14px;right:14px;width:160px;height:90px;border-radius:10px;overflow:hidden;opacity:.12;transition:opacity .3s;z-index:5}
#ytWrap.active{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="menu">
  <button id="btn" class="btn" aria-label="Play"><span class="tri"></span><span class="sq"><i></i><i></i></span></button>
  <div class="bars">
    <div class="row"><span>SEEK</span><input id="seek" type="range" min="0" max="100" step="1" value="0"><span id="tm">0:00</span></div>
    <div class="row"><span>VOL</span><input id="vol" type="range" min="0" max="100" step="1" value="80"></div>
  </div>
</div>
<div class="center"><h1>LOOMA</h1><p>By Vayu</p></div>
<div id="ytWrap"><div id="yt"></div></div>
<script>
const VIDEO_ID = '4WNPgQ2PHbE';

const btn=document.getElementById('btn'),seek=document.getElementById('seek'),vol=document.getElementById('vol'),tm=document.getElementById('tm'),wrap=document.getElementById('ytWrap');
let ytPlayer,ready=0,playing=0,scrub=0,ctx;

function clickSfx(up){
  if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended')ctx.resume();
  const n=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
  o.type='triangle';o.frequency.setValueAtTime(up?520:360,n);o.frequency.exponentialRampToValueAtTime(up?170:110,n+.045);
  g.gain.setValueAtTime(.22,n);g.gain.exponentialRampToValueAtTime(.0001,n+.05);
  o.connect(g);g.connect(ctx.destination);o.start(n);o.stop(n+.055);
}

const tag=document.createElement('script');
tag.src='https://youtube.com';
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady=()=>{
  ytPlayer=new YT.Player('yt',{
    width:'160',height:'90',
    videoId:VIDEO_ID,
    playerVars:{autoplay:0,controls:1,playsinline:1,loop:1,playlist:VIDEO_ID},
    events:{
      onReady:e=>{ready=1;e.target.setVolume(+vol.value);seek.max=e.target.getDuration()||100},
      onStateChange:e=>{
        playing=(e.data===1);
        btn.classList.toggle('on',playing);
        if(playing){wrap.classList.add('active');seek.max=ytPlayer.getDuration()||100}
        if(e.data===0)ytPlayer.playVideo();
      },
      onError:e=>{tm.textContent='E'+e.data}
    }
  });
};

function fmt(s){const m=s/60|0,r=(s|0)%60;return m+':'+(r<10?'0':'')+r}

setInterval(()=>{
  if(ready&&playing&&!scrub){
    const cur=ytPlayer.getCurrentTime()||0;
    seek.value=cur;tm.textContent=fmt(cur);
  }
},400);

btn.onclick=()=>{
  btn.classList.remove('bounce');void btn.offsetWidth;btn.classList.add('bounce');
  const next=!playing;clickSfx(next);
  if(!ready){tm.textContent='WAIT';return}
  if(next){ytPlayer.unMute();ytPlayer.setVolume(+vol.value);ytPlayer.playVideo()}
  else{ytPlayer.pauseVideo()}
};
seek.oninput=()=>{scrub=1;tm.textContent=fmt(+seek.value)};
seek.onchange=()=>{if(ready)ytPlayer.seekTo(+seek.value,true);scrub=0};
vol.oninput=()=>{if(ready)ytPlayer.setVolume(+vol.value)};
</script>
</body>
</html>
